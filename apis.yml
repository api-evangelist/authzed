apis:
- name: Authzed Cloud API
  description: >-
    The managed cloud offering of SpiceDB by Authzed, providing production-ready authorization infrastructure
    with hourly metered billing. Includes all SpiceDB API capabilities plus Authzed-specific features
    such as Restricted API Access with role-based token policies, service account management, and multi-region
    deployment.
